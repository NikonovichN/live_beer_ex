name: live_beer_ex
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  logger: ^2.6.2
  go_router: ^16.3.0
  flutter_riverpod: ^3.0.3
  vector_graphics: ^1.1.19
  vector_graphics_compiler: ^1.1.19
  equatable: ^2.0.7
  intl: ^0.20.2
  translator: ^1.0.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: SF-UI-DISPLAY
      fonts:
        - asset: assets/fonts/sf-ui-display/sf-ui-display-black.otf
          weight: 900
        - asset: assets/fonts/sf-ui-display/sf-ui-display-bold.otf
          weight: 700
        - asset: assets/fonts/sf-ui-display/sf-ui-display-heavy.otf
          weight: 800
        - asset: assets/fonts/sf-ui-display/sf-ui-display-light.otf
          weight: 300
        - asset: assets/fonts/sf-ui-display/sf-ui-display-medium.otf
          weight: 500
        - asset: assets/fonts/sf-ui-display/sf-ui-display-semibold.otf
          weight: 600
        - asset: assets/fonts/sf-ui-display/sf-ui-display-thin.otf
          weight: 100
        - asset: assets/fonts/sf-ui-display/sf-ui-display-ultralight.otf
          weight: 200

  assets:
    - assets/images/
    - assets/
    - path: assets/svg/
      transformers:
        - package: vector_graphics_compiler
